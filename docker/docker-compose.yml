services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-2.5}
      NON_COMMERCIAL: ${NON_COMMERCIAL:-false}
      CONTEXT_LENGTH: ${CONTEXT_LENGTH:-512}
      DEVICE: ${DEVICE:-auto}
      DATA_DIR: /data/app_data
      API_KEY: ${API_KEY:-change-me-please}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-1}
    volumes:
      - gold-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  gold-data:
