services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-2.5}
      NON_COMMERCIAL: ${NON_COMMERCIAL:-false}
      CONTEXT_LENGTH: ${CONTEXT_LENGTH:-512}
      DEVICE: ${DEVICE:-auto}
      DATA_DIR: /data/app_data
      API_KEY: ${API_KEY:-change-me-please}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # Weights (~1 GB) download into the mounted volume on first start.
      HF_HOME: /data/hf_cache
    volumes:
      - gold-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # The backend seeds data + downloads model weights on very first start;
    # the long start_period covers that one-time warmup. A probe returning
    # HTTP 200 marks it healthy (model load progress is reported via /health).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5); print('ok')"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 900s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host 5173 is often taken (e.g. local Vite); use 5174 by default.
      - "${FRONTEND_PORT:-5174}:80"
    restart: unless-stopped

volumes:
  gold-data:
